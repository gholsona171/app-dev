name: railcar-loader tests

on:
  push:
    paths:
      - 'apps/railcar-loader/**'
      - '.github/workflows/railcar-loader-tests.yml'
  pull_request:
    paths:
      - 'apps/railcar-loader/**'
      - '.github/workflows/railcar-loader-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/railcar-loader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
